# kurena pipeline configuration.
[kurena]
executor = { driver = "devin", model = "swe-2" }       # driver for implementation (and planning when planner is unset)
reviewer = { driver = "devin", model = "swe-2" }       # driver for diff review
max_verify_attempts = 3  # verify self-fix loop bound
max_revises = 2          # reviewer revise loop bound
max_implement_retries = 1  # implement executor-failure retry bound
timeout_sec = 1800       # per subprocess invocation

# Verify commands run in declaration order inside the task worktree:
[[verify]]
name = "test-workspace"
cmd = "cargo test --workspace"

[[verify]]
name = "clippy"
cmd = "cargo clippy --workspace --all-targets -- -D warnings"

# Custom agent-CLI drivers:
# [drivers.mycli]
# cmd = "my-agent"
# args = ["run", "--yes"]
# prompt_via = "arg"      # or "stdin" / "file" (writes prompt to a file, {prompt} = its path)
