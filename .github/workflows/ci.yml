name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run on the org Mac mini (M4, labels macOS/ARM64):
# the Intel runner (Late 2014) needs ~17 min for the jpeg
# OpenROAD flow alone, and generated outputs were verified
# bit-identical between the two machines, so the golden files
# do not care which one produced the inputs. Docker comes
# from Colima; the sky130A PDK is under ~/.ciel and Rust is
# mise-installed. The trade-off is the shared queue with the
# repositories that need macOS/ARM64. Generated inputs cross
# between the jobs as a workflow artifact.

jobs:
  generate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Put cargo and mise on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Start Colima
        run: |
          mise exec docker-cli@latest colima@latest lima@latest -- colima status >/dev/null 2>&1 \
            || mise exec docker-cli@latest colima@latest lima@latest -- colima start --memory 12 --cpu 8

      - name: Generate picorv32 reference inputs
        if: ${{ hashFiles('tests/designs/picorv32/picorv32.rcx.spef') == '' }}
        run: tests/designs/picorv32/generate_ref.sh

      - name: Generate aes reference inputs
        if: ${{ hashFiles('tests/designs/aes/aes.util65.def') == '' }}
        run: tests/designs/aes/generate_ref.sh

      - name: Generate jpeg reference inputs
        if: ${{ hashFiles('tests/designs/jpeg/jpeg.util65.def') == '' }}
        run: tests/designs/jpeg/generate_ref.sh

      - name: Generate ibex reference inputs
        if: ${{ hashFiles('tests/designs/ibex/ibex.util65.def') == '' }}
        run: tests/designs/ibex/generate_ref.sh

      - name: Collect per-pin OpenSTA dumps
        run: |
          [ -f tests/designs/aes/pins_placed.txt ] || tests/designs/collect_pins.sh aes aes.placed.def aes.routed.spef pins_placed.txt
          [ -f tests/designs/picorv32/pins_routed.txt ] || tests/designs/collect_pins.sh picorv32 picorv32.placed.def picorv32.rcx.spef pins_routed.txt
          [ -f tests/designs/ibex/pins_placed.txt ] || tests/designs/collect_pins.sh ibex ibex.placed.def ibex.routed.spef pins_placed.txt
          [ -f tests/designs/jpeg/pins_placed.txt ] || tests/designs/collect_pins.sh jpeg jpeg.placed.def jpeg.routed.spef pins_placed.txt

      - name: Upload generated reference inputs
        uses: actions/upload-artifact@v4
        with:
          name: reference-inputs
          if-no-files-found: error
          retention-days: 7
          path: |
            tests/designs/picorv32/picorv32.synth.v
            tests/designs/picorv32/picorv32.synth.json
            tests/designs/picorv32/picorv32.floorplan.def
            tests/designs/picorv32/picorv32.placed.def
            tests/designs/picorv32/picorv32.routed.spef
            tests/designs/picorv32/picorv32.routed.def
            tests/designs/picorv32/picorv32.rcx.spef
            tests/designs/picorv32/picorv32.sta.reference.json
            tests/designs/picorv32/picorv32.util65.def
            tests/designs/picorv32/pins_routed.txt
            tests/designs/aes/aes.synth.v
            tests/designs/aes/aes.synth.json
            tests/designs/aes/aes.floorplan.def
            tests/designs/aes/aes.placed.def
            tests/designs/aes/aes.orient.def
            tests/designs/aes/aes.util65.def
            tests/designs/aes/aes.routed.spef
            tests/designs/aes/pins_placed.txt
            tests/designs/jpeg/jpeg.synth.v
            tests/designs/jpeg/jpeg.synth.json
            tests/designs/jpeg/jpeg.floorplan.def
            tests/designs/jpeg/jpeg.placed.def
            tests/designs/jpeg/jpeg.orient.def
            tests/designs/jpeg/jpeg.orient.pins.txt
            tests/designs/jpeg/jpeg.util65.def
            tests/designs/jpeg/jpeg.routed.spef
            tests/designs/jpeg/jpeg.sta.reference.json
            tests/designs/jpeg/pins_placed.txt
            tests/designs/ibex/ibex.synth.v
            tests/designs/ibex/ibex.synth.json
            tests/designs/ibex/ibex.floorplan.def
            tests/designs/ibex/ibex.placed.def
            tests/designs/ibex/ibex.orient.def
            tests/designs/ibex/ibex.orient.pins.txt
            tests/designs/ibex/ibex.util65.def
            tests/designs/ibex/ibex.routed.spef
            tests/designs/ibex/ibex.sta.reference.json
            tests/designs/ibex/pins_placed.txt

  test:
    needs: generate
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download generated reference inputs
        uses: actions/download-artifact@v4
        with:
          name: reference-inputs
          # upload-artifact strips the common ancestor
          # (tests/designs), so extract back under it.
          path: tests/designs

      - name: Put cargo and mise on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Test (release)
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
