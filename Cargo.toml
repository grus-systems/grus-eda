[workspace]
resolver = "2"
members = ["crates/grus-core", "crates/grus-eda"]

[workspace.package]
version = "0.1.94"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
